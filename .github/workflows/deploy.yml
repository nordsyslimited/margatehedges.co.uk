name: Deploy to Krystal FTPS
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write deploy-time secrets
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          mkdir -p config
          cat > config/secrets.php <<PHP
          <?php
          // deploy-time generated $(date -u +%Y-%m-%dT%H:%M:%SZ)
          return [
              'resend_api_key' => '${RESEND_API_KEY}',
          ];
          PHP
      - name: FTP-Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: p125.lon.krystal.io
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftps
          port: 21
          local-dir: ./
          server-dir: /
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.DS_Store
            README.md
            assets/partials.html
